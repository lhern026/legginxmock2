<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; padding:20px 0; }
  .demo { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .box { width:140px; height:84px; background:#FAFAF7; border:1px solid #E8E8E3; }
</style></head>
<body>
<div class="card" style="background:#F4F4F0">
  <div class="label">Shadows — almost none</div>
  <div class="grid">
    <div class="demo"><div class="box" style="box-shadow:none"></div><div class="swatch-name">none</div><div class="swatch-hex">default · 99% of UI</div></div>
    <div class="demo"><div class="box" style="box-shadow:0 8px 32px -8px rgba(10,10,10,.08)"></div><div class="swatch-name">--shadow-soft</div><div class="swatch-hex">menus, dropdowns</div></div>
    <div class="demo"><div class="box" style="box-shadow:0 24px 64px -16px rgba(10,10,10,.16)"></div><div class="swatch-name">--shadow-overlay</div><div class="swatch-hex">cart drawer, modals</div></div>
  </div>
</div>
</body></html>
