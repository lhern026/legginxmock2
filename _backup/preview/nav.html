<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .nav { display:flex; align-items:center; padding:18px 24px; border-bottom:1px solid #D4D4CE; }

  .links { display:flex; gap:28px; margin-left:48px; flex:1; }
  .links a { font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:#0A0A0A; }
  .icons { display:flex; gap:18px; }
  .ic { width:18px; height:18px; stroke:#0A0A0A; stroke-width:1.5; fill:none; }
</style></head>
<body>
<div class="card" style="padding:0">

    </div>

      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <svg class="ic" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
    </div>
  </nav>

</div>
</body></html>
