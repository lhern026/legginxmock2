<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn { font-family:var(--font-body); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.16em; padding:14px 24px; border:1px solid; cursor:pointer; transition: all 160ms cubic-bezier(0.2,0,0.2,1); }
  .btn-primary { background:#0A0A0A; color:#FAFAF7; border-color:#0A0A0A; }
  .btn-primary:hover { background:#2E2E2B; border-color:#2E2E2B; }
  .btn-secondary { background:transparent; color:#0A0A0A; border-color:#0A0A0A; }
  .btn-secondary:hover { background:#0A0A0A; color:#FAFAF7; }
  .btn-ghost { background:transparent; color:#0A0A0A; border-color:transparent; padding:14px 0; }
  .btn-ghost:hover { text-decoration:underline; text-underline-offset:4px; }
  .row4 { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .colset { display:flex; flex-direction:column; gap:6px; }
</style></head>
<body>
<div class="card">
  <div class="label">Buttons</div>
  <div class="row4">
    <div class="colset"><button class="btn btn-primary">Add to bag</button><div class="swatch-hex">Primary · Ink</div></div>
    <div class="colset"><button class="btn btn-secondary">Notify me</button><div class="swatch-hex">Secondary · outlined</div></div>
    <div class="colset"><button class="btn btn-ghost">Continue shopping →</button><div class="swatch-hex">Ghost · text only</div></div>
  </div>
  <div class="swatch-hex" style="border-top:1px solid var(--stone-100);padding-top:10px">
    Sharp corners. No scale on press. Hover lightens by one Stone step.
  </div>
</div>
</body></html>
