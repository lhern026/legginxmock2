<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row2 { display:flex; align-items:baseline; gap:16px; padding:6px 0; border-bottom:1px solid var(--stone-100); }
  .row2:last-child { border-bottom:0; }
  .meta { font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-2); width:120px; flex:none; }
  .sample { color: var(--fg-1); }
</style></head>
<body>
<div class="card">
  <div class="label">Type scale</div>
  <div class="row2"><div class="meta">Hero · 14vw</div><div class="sample" style="font-family:var(--font-display);font-size:48px;line-height:0.9;text-transform:uppercase">LEGGINX</div></div>
  <div class="row2"><div class="meta">Display-1 · 176</div><div class="sample" style="font-family:var(--font-display);font-size:36px;line-height:1;text-transform:uppercase">CORE</div></div>
  <div class="row2"><div class="meta">2xl · 32 / 1.15</div><div class="sample" style="font-weight:600;font-size:22px">Compression where you need it.</div></div>
  <div class="row2"><div class="meta">lg · 18 / 1.55</div><div class="sample" style="font-size:16px">Built for the rest of the day.</div></div>
  <div class="row2"><div class="meta">base · 16 / 1.6</div><div class="sample" style="font-size:14px;color:var(--fg-2)">Four-way stretch. Sweat-wicking.</div></div>
  <div class="row2"><div class="meta">xs · 12 mono</div><div class="sample" style="font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2)">SKU LX-CORE-001</div></div>
