<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatches { display:grid; grid-template-columns:repeat(12, 1fr); gap:6px; }
  .ch { aspect-ratio:1/1; border:1px solid #E8E8E3; }
  .nm { font-family:var(--font-mono); font-size:8px; letter-spacing:.04em; text-transform:uppercase; color:var(--fg-2); margin-top:4px; text-align:center; line-height:1.2; }
  .col { display:flex; flex-direction:column; }
</style></head>
<body>
<div class="card">
  <div class="label">Product palette — colors live on the garment, not the UI</div>
  <div class="swatches">
    <div class="col"><div class="ch" style="background:#2C3E5C"></div><div class="nm">Navy</div></div>
    <div class="col"><div class="ch" style="background:#E89A82"></div><div class="nm">Peach</div></div>
    <div class="col"><div class="ch" style="background:#A8C4D6"></div><div class="nm">Sky</div></div>
    <div class="col"><div class="ch" style="background:#7AA68B"></div><div class="nm">Jade</div></div>
    <div class="col"><div class="ch" style="background:#9DB89F"></div><div class="nm">Sage</div></div>
    <div class="col"><div class="ch" style="background:#A8C9B6"></div><div class="nm">Mint</div></div>
    <div class="col"><div class="ch" style="background:#C8909A"></div><div class="nm">Rose</div></div>
    <div class="col"><div class="ch" style="background:#D29BB0"></div><div class="nm">Blossom</div></div>
    <div class="col"><div class="ch" style="background:#B8475A"></div><div class="nm">Crimson</div></div>
    <div class="col"><div class="ch" style="background:#A05D7A"></div><div class="nm">Plum</div></div>
    <div class="col"><div class="ch" style="background:#C2B6D9"></div><div class="nm">Lavender</div></div>
    <div class="col"><div class="ch" style="background:#B83A6E"></div><div class="nm">Magenta</div></div>
    <div class="col"><div class="ch" style="background:#E8E4DD"></div><div class="nm">Pearl</div></div>
    <div class="col"><div class="ch" style="background:#F0E6D2"></div><div class="nm">Ivory</div></div>
    <div class="col"><div class="ch" style="background:#D4C4A8"></div><div class="nm">Almond</div></div>
    <div class="col"><div class="ch" style="background:#E8C4AC"></div><div class="nm">Blush</div></div>
    <div class="col"><div class="ch" style="background:#A89580"></div><div class="nm">Hazel</div></div>
    <div class="col"><div class="ch" style="background:#94948E"></div><div class="nm">Stone</div></div>
    <div class="col"><div class="ch" style="background:#8C7860"></div><div class="nm">Chestnut</div></div>
    <div class="col"><div class="ch" style="background:#6B7B3F"></div><div class="nm">Olive</div></div>
    <div class="col"><div class="ch" style="background:#3A6B4F"></div><div class="nm">Emerald</div></div>
    <div class="col"><div class="ch" style="background:#9B3030"></div><div class="nm">Ember</div></div>
    <div class="col"><div class="ch" style="background:#1F3A6B"></div><div class="nm">Royal</div></div>
    <div class="col"><div class="ch" style="background:#1A1A18"></div><div class="nm">Onyx</div></div>
  </div>
  <div class="swatch-hex" style="margin-top:8px">24 colorways across the line. UI shell stays B&W.</div>
</div>
</body></html>
