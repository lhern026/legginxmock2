<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .bar { background:#0A0A0A; height:14px; }
  .row3 { display:flex; align-items:center; gap:12px; padding:4px 0; }
  .name { font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-1); width:90px; flex:none; }
  .px   { font-family:var(--font-mono); font-size:10px; color:var(--fg-2); width:48px; flex:none; }
</style></head>
<body>
<div class="card">
  <div class="label">Spacing · 8pt grid</div>
  <div class="row3"><div class="name">space-1</div><div class="px">4</div><div class="bar" style="width:4px"></div></div>
  <div class="row3"><div class="name">space-2</div><div class="px">8</div><div class="bar" style="width:8px"></div></div>
  <div class="row3"><div class="name">space-3</div><div class="px">12</div><div class="bar" style="width:12px"></div></div>
  <div class="row3"><div class="name">space-4</div><div class="px">16</div><div class="bar" style="width:16px"></div></div>
  <div class="row3"><div class="name">space-5</div><div class="px">24</div><div class="bar" style="width:24px"></div></div>
  <div class="row3"><div class="name">space-6</div><div class="px">32</div><div class="bar" style="width:32px"></div></div>
  <div class="row3"><div class="name">space-8</div><div class="px">48</div><div class="bar" style="width:48px"></div></div>
  <div class="row3"><div class="name">space-10</div><div class="px">64</div><div class="bar" style="width:64px"></div></div>
  <div class="row3"><div class="name">space-12</div><div class="px">96</div><div class="bar" style="width:96px"></div></div>
  <div class="row3"><div class="name">space-14</div><div class="px">128</div><div class="bar" style="width:128px"></div></div>
  <div class="row3"><div class="name">space-16</div><div class="px">192</div><div class="bar" style="width:192px"></div></div>
</div>
</body></html>
