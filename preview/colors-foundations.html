<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch">
      <div class="swatch-chip" style="background:#0A0A0A"></div>
      <div class="swatch-name">Ink</div>
      <div class="swatch-hex">#0A0A0A · --ink</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#FAFAF7"></div>
      <div class="swatch-name">Paper</div>
      <div class="swatch-hex">#FAFAF7 · --paper</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#FFFFFF"></div>
      <div class="swatch-name">Pure White</div>
      <div class="swatch-hex">#FFFFFF · --pure-white</div>
    </div>
  </div>
</div>
</body></html>
