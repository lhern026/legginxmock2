<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .iconrow { display:grid; grid-template-columns:repeat(8, 1fr); gap:16px; }
  .ic-cell { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .ic { width:24px; height:24px; stroke:#0A0A0A; stroke-width:1.5; fill:none; stroke-linecap:square; stroke-linejoin:miter; }
  .ic-name { font-family:var(--font-mono); font-size:9px; letter-spacing:.04em; color:var(--fg-2); }
</style></head>
<body>
<div class="card">
  <div class="label">Iconography · Lucide @ 1.5px stroke, square caps</div>
  <div class="iconrow">
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><div class="ic-name">search</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><div class="ic-name">user</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><div class="ic-name">bag</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg><div class="ic-name">x</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><div class="ic-name">chevron-d</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><div class="ic-name">chevron-r</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><div class="ic-name">plus</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg><div class="ic-name">minus</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg><div class="ic-name">check</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><div class="ic-name">arrow-r</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg><div class="ic-name">arr-up-r</div></div>
    <div class="ic-cell"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="0.8" fill="#0A0A0A"/></svg><div class="ic-name">instagram</div></div>
  </div>
</div>
</body></html>
