<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .scale .swatch-chip { aspect-ratio: 1 / 1.4; }
  .scale .swatch-name { font-size: 9px; letter-spacing: 0.04em; }
  .scale .swatch-hex  { font-size: 9px; }
</style>
</head>
<body>
<div class="card">
  <div class="scale">
    <div class="swatch"><div class="swatch-chip" style="background:#F4F4F0"></div><div class="swatch-name">50</div><div class="swatch-hex">F4F4F0</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#E8E8E3"></div><div class="swatch-name">100</div><div class="swatch-hex">E8E8E3</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#D4D4CE"></div><div class="swatch-name">200</div><div class="swatch-hex">D4D4CE</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#B8B8B2"></div><div class="swatch-name">300</div><div class="swatch-hex">B8B8B2</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#94948E"></div><div class="swatch-name">400</div><div class="swatch-hex">94948E</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#6E6E68"></div><div class="swatch-name">500</div><div class="swatch-hex">6E6E68</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#4C4C47"></div><div class="swatch-name">600</div><div class="swatch-hex">4C4C47</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#2E2E2B"></div><div class="swatch-name">700</div><div class="swatch-hex">2E2E2B</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#1A1A18"></div><div class="swatch-name">800</div><div class="swatch-hex">1A1A18</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#0F0F0E"></div><div class="swatch-name">900</div><div class="swatch-hex">0F0F0E</div></div>
  </div>
</div>
</body></html>
